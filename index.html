<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boda Hela</title>
<meta name="theme-color" content="#0f1318">
<meta name="msapplication-TileColor" content="#0f1318">
<meta name="description" content="Boda Hela - play-money boda ride game">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boda Hela">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f1318;--card:#1a1f26;--ink:#eef1f3;--mute:#9aa5ae;--line:#2b323a;--go:#17a05d;--stop:#d6402b;--gold:#ffc82e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#20252b;--ink:#eef1f3;--mute:#9aa5ae;--line:#323940}}
:root[data-theme="dark"]{--bg:#15181c;--card:#20252b;--ink:#eef1f3;--mute:#9aa5ae;--line:#323940}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100%}
main{max-width:560px;margin:0 auto;padding:12px;position:relative}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:22px;margin:0;font-weight:800}
.bal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700}
.hist{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:#7a828a;color:#fff}
.chip.mid{background:var(--go)}.chip.hi{background:var(--gold);color:#1a1d21}
canvas{display:block;width:100%;height:var(--ch,280px);border-radius:14px}
.bets{display:grid;gap:10px;margin-top:10px}
.bet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.row{display:flex;gap:6px;align-items:center}
.row button,.chips button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-weight:700}
.row input{width:100%;min-width:0;text-align:center;font:inherit;font-weight:700;font-size:18px;padding:7px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.chips{display:flex;gap:6px}.chips button{flex:1;padding:6px 0;font-size:13px}
label{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
label.tg{justify-content:space-between;color:var(--ink);font-weight:700}
label.tg input{width:22px;height:22px;padding:0;accent-color:var(--go)}
label input{width:90px;text-align:center;font:inherit;padding:5px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.act{border:0;border-radius:10px;padding:14px;font:inherit;font-weight:800;font-size:18px;color:#fff;background:var(--go)}
.act.cash{background:var(--gold);color:#1a1d21}.act.cancel{background:var(--stop)}.act.done{background:#4b7f63}.act.lost{background:#7a828a}
.act:disabled{opacity:.85}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--go);color:#fff;font-weight:800;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.toast.on{opacity:1}.toast.err{background:var(--stop)}
.hr{display:flex;gap:8px;align-items:center}
#gear{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1;padding:0}
.set{display:none;position:absolute;right:12px;top:58px;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.set.on{display:block}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:15px;color:var(--ink)}
.sw+.sw{border-top:1px solid var(--line)}
.sw input{width:22px;height:22px;padding:0;accent-color:var(--go)}
.tabs{display:flex;gap:4px;margin-top:14px;background:var(--card);border-radius:99px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);border-radius:99px;padding:9px 0;font:inherit;font-weight:600}
.tabs button.on{background:var(--line);color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:8px;padding:8px}
.plist{max-height:340px;overflow-y:auto}
#psum:empty{display:none}
.cvw{position:relative}
.pcount{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;padding:3px 12px 3px 4px;border-radius:99px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);font-weight:700;font-size:15px;color:#fff;pointer-events:none}
.pcount[hidden]{display:none}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-style:normal;font-size:15px;flex:none}
.avs{display:inline-flex}.avs .av{margin-left:-9px;border:2px solid #2d9a2d;width:32px;height:32px}.avs .av:first-child{margin-left:0}
.rsum{background:var(--bg);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.rtop{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.rc{margin-top:6px;font-size:15px;color:var(--mute)}.rc b{color:var(--ink);font-weight:700}
.rr{text-align:right}.rr b{display:block;font-size:26px;line-height:1.1;font-weight:800}.rr small{color:var(--mute);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--card);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#3aa51a;border-radius:99px;transition:width .4s}
.stk{margin-top:8px;font-size:13px;color:var(--mute)}.stk b{color:var(--ink)}
.pr{display:grid;grid-template-columns:1.2fr 1.1fr .8fr 1.1fr;align-items:center;gap:6px;padding:6px 14px 6px 8px;border-radius:99px;background:var(--bg);border:1px solid transparent;margin-bottom:6px;font-size:14px;font-weight:600}
.pr>span:nth-child(2),.pr>span:nth-child(4){text-align:right}.pr>span:nth-child(3){text-align:center}
.pr.ph{background:none;font-size:12px;color:var(--mute);font-weight:500;padding:2px 14px 2px 8px;margin-bottom:2px}
.pn{display:flex;align-items:center;gap:8px;min-width:0}.pn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr.won{background:rgba(58,165,26,.14);border-color:rgba(58,165,26,.6)}
.pr.me{border-color:var(--gold)}
.px i{font-style:normal;font-weight:800;font-size:12px;padding:2px 8px;border-radius:99px;background:#1e5f9c;color:#fff}.px i.m2{background:#7b3fc4}.px i.m3{background:#c2358f}
.pw{color:#6fe04a;font-weight:700}
@media(max-width:420px){.pr{font-size:13px;padding:5px 10px 5px 6px;gap:4px}.pr .av{width:24px;height:24px;font-size:13px}.pn{gap:6px}}
.sum{font-size:13px;color:var(--mute);padding:6px 0}
.r{display:grid;grid-template-columns:1.2fr 1fr .9fr 1.1fr;gap:6px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.r span:nth-child(n+2){text-align:right}
.r.h{font-size:12px;color:var(--mute);border-top:0}
.r.w{color:var(--go);font-weight:700}.r.l{color:var(--mute)}
.r.me{background:rgba(255,200,46,.18)}
.empty{padding:16px 0;color:var(--mute);font-size:14px}
footer{margin-top:14px;font-size:12px;color:var(--mute);line-height:1.5}
footer button{background:none;border:0;color:var(--ink);text-decoration:underline;font:inherit;padding:0}
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 55%,#1d242d 0%,#0f1318 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .2s}
#splash.off{opacity:0;pointer-events:none}
#splash video,#splash .shade{position:absolute;inset:0;width:100%;height:100%}
#splash video{object-fit:cover}
#splash .shade{background:linear-gradient(180deg,rgba(15,19,24,.25),rgba(15,19,24,.45))}
#splash .ttl,#splash .sub{opacity:0}
#splash .ttl{position:relative;margin:0;text-align:center;font-family:Bungee,Impact,"Arial Black",sans-serif;font-weight:400;font-size:clamp(60px,19vw,130px);line-height:.95;letter-spacing:.02em;transform:skewX(-8deg);filter:drop-shadow(0 4px 0 #7d1c0a) drop-shadow(0 0 20px rgba(255,150,30,.55))}
#splash .ttl span{display:block;color:transparent;-webkit-background-clip:text;background-clip:text;background-repeat:no-repeat;background-size:250% 100%,100% 100%}
#splash .ttl .a{background-image:linear-gradient(105deg,transparent 40%,#fff 50%,transparent 60%),linear-gradient(180deg,#fff 0%,#cdd4da 50%,#8e99a3 100%)}
#splash .ttl .b{background-image:linear-gradient(105deg,transparent 40%,#fff 50%,transparent 60%),linear-gradient(180deg,#fff27a 0%,#ffc82e 50%,#ff8a1f 100%)}
#splash .sub{position:relative;margin-top:16px;font-weight:800;font-size:clamp(14px,4.6vw,24px);letter-spacing:.3em;color:var(--gold);text-shadow:0 0 14px rgba(255,200,46,.6);padding-left:.3em}
#splash.go .ttl{animation:spIn .7s cubic-bezier(.2,.9,.3,1.2) .15s forwards}
#splash.go .ttl span{animation:spShine 1s ease-out .7s forwards}
#splash.go .sub{animation:spSub .6s ease-out 1s forwards}
@keyframes spIn{from{opacity:0;transform:skewX(-8deg) scale(1.3)}to{opacity:1;transform:skewX(-8deg) scale(1)}}
@keyframes spShine{from{background-position:0% 0,0 0}to{background-position:100% 0,0 0}}
@keyframes spSub{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#install{margin-left:10px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);margin:-12px -12px 0;padding:12px 12px 8px}
.set{top:58px}
.toast{z-index:9}

button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(hover:hover){.act:hover:not(:disabled){filter:brightness(1.12)}.row button:hover,.chips button:hover,.tabs button:hover,#gear:hover{border-color:var(--mute)}}
/* tablet */
@media(min-width:700px) and (max-width:899px){:root{--ch:320px}main{max-width:720px;padding:16px}.bets{grid-template-columns:1fr 1fr}}
/* phone in landscape: header scrolls away so the game keeps room */
@media(max-height:520px) and (max-width:899px){:root{--ch:210px}#top{position:static}}
/* desktop / laptop / Windows: canvas + bets on the left, history panels on the right */
@media(min-width:900px){
  :root{--ch:340px}
  main{max-width:1180px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"top side" "bets side";column-gap:20px;align-items:start}
  #top{grid-area:top;position:static;margin:0;padding:0 0 4px;background:none}
  .bets{grid-area:bets;grid-template-columns:1fr 1fr;margin-top:10px}
  #side{grid-area:side}
  .tabs{margin-top:0}
  .plist{max-height:min(54vh,500px)}
  .set{right:0;top:52px}
  h1{font-size:26px}
  .bal{font-size:17px;padding:8px 14px}
  footer{font-size:13px}
}
@media(min-width:900px) and (max-height:620px){:root{--ch:240px}}
@media(min-width:1400px){:root{--ch:420px}main{max-width:1320px;grid-template-columns:minmax(0,1fr) 400px}}
@media(min-width:1400px) and (max-height:760px){:root{--ch:320px}}
</style>
</head>
<body class="locked">
<main>
<div id="top"><header><h1>Boda Hela</h1><div class="hr"><div class="bal">KSh <span id="bal">0</span></div><button id="gear" aria-label="Settings">⚙</button></div></header>
<div class="set" id="set"><label class="sw"><span>Sounds</span><input type="checkbox" id="optSnd"></label><label class="sw"><span>Rider</span><input type="checkbox" id="optRider"></label><label class="sw"><span>Scenery</span><input type="checkbox" id="optScene"></label></div>
<div class="hist" id="hist"></div>
<div class="cvw"><canvas id="cv"></canvas><div class="pcount" id="pcount" hidden></div></div></div>
<div class="bets" id="bets"></div>
<aside id="side"><div class="tabs"><button class="on" data-tab="players">Riders</button><button data-tab="mine">My bets</button><button data-tab="best">Top wins</button></div>
<div class="panel" id="panel"><div id="psum"></div><div class="plist" id="plist"></div></div>
<footer><button id="reset">Top up to KSh 1,000 (only below KSh 10)</button> <button id="install" hidden>Install app</button></footer></aside>
</main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const fmt=n=>Math.round(n).toLocaleString();
const fmt2=n=>n.toLocaleString(undefined,{maximumFractionDigits:2});
let bal=1000;
try{const v=localStorage.getItem('bc_bal');if(v!==null&&!isNaN(+v))bal=+v}catch(e){}
function save(){bal=Math.round(bal*100)/100;try{localStorage.setItem('bc_bal',bal)}catch(e){}$('#bal').textContent=fmt2(bal)}
function toast(t,err){const e=$('#toast');e.textContent=t;e.className='toast on'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='toast',1600)}

window.gameOn=false;
let phase='wait',mult=1,crashAt=2,tc=0,countdown=6,hist=[],scroll=0,last=0,riderX=0,wheel=0,parts=[];
function newCrash(){const a=new Uint32Array(1);crypto.getRandomValues(a);const r=a[0]/4294967296;return Math.min(1000,Math.max(1,Math.floor(97/(1-r))/100))}

const bets=[0,1].map(i=>({i,queued:false,active:false,cashed:false,cm:0,stake:0,auto:false}));
$('#bets').innerHTML=bets.map(b=>`<div class="bet" id="p${b.i}">
<div class="row"><button data-d="-10">−</button><input class="stake" type="number" inputmode="numeric" value="${b.i?100:50}"><button data-d="10">+</button></div>
<div class="chips">${[50,100,500,1000].map(v=>`<button data-v="${v}">${v}</button>`).join('')}</div>
<label>Auto cash out at <input class="auto" inputmode="decimal" placeholder="off">x</label>
<label class="tg"><span>Auto bet every ride</span><input class="ab" type="checkbox"></label>
<button class="act"></button></div>`).join('');
bets.forEach(b=>{
  const p=$('#p'+b.i);b.stakeEl=p.querySelector('.stake');b.autoEl=p.querySelector('.auto');b.act=p.querySelector('.act');b.abEl=p.querySelector('.ab');
  b.abEl.onchange=()=>{b.auto=b.abEl.checked;if(b.auto)toast('Auto bet on')};
  p.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{if(!b.queued&&!b.active)b.stakeEl.value=Math.max(10,(+b.stakeEl.value||0)+ +x.dataset.d)});
  p.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{if(!b.queued&&!b.active)b.stakeEl.value=x.dataset.v});
  b.act.onclick=()=>press(b);
});
async function press(b){
  if(b.busy)return;
  const fly=b.active&&!b.cashed&&phase==='fly';
  if(b.active&&!fly)return;
  let a='bet',body;
  if(fly){a='cashout';body={slot:b.i}}
  else if(b.queued){body={slot:b.i,cancel:true};if(b.auto){b.auto=false;b.abEl.checked=false}}
  else{
    const s=Math.floor(+b.stakeEl.value);
    if(!(s>=10)){toast('Minimum bet is KSh 10',1);return}
    if(s>bal){toast('Not enough play money',1);return}
    const au=parseFloat(b.autoEl.value);
    body={slot:b.i,stake:s,auto:au>1.01?au:0};
    b.autoPinged=false;
  }
  b.busy=true;
  try{await api(a,body);if(a==='bet')tone(body.cancel?300:520,.08,'square',.06)}
  catch(e){
    toast(e.msg||'No connection. Try again.',1);
    if(a==='bet'&&!body.cancel&&b.auto){b.auto=false;b.abEl.checked=false}
    if(a==='cashout')setTimeout(refreshMe,300);
  }
  b.busy=false;
}
function autoPlace(b){
  if(!b.auto||phase!=='wait'||!round||b.queued||b.active||b.busy)return;
  const s=Math.floor(+b.stakeEl.value);
  if(!(s>=10)||s>bal){b.auto=false;b.abEl.checked=false;toast(s>bal?'Auto bet stopped: not enough play money':'Auto bet stopped: minimum bet is KSh 10',1);return}
  press(b);
}
function render(b){
  let t,c='';
  if(b.busy){t='Please wait…';c='cancel'}
  else if(b.active&&!b.cashed&&phase==='fly'){t='Cash out KSh '+fmt2(Math.floor(b.stake*mult*100)/100);c='cash'}
  else if(b.active&&b.cashed){t='Cashed out at '+b.cm.toFixed(2)+'x';c='done'}
  else if(b.active&&phase==='crash'){t='Lost KSh '+fmt(b.stake);c='lost'}
  else if(b.queued){t=(b.auto?'Stop auto bet (KSh ':'Cancel bet (KSh ')+fmt(b.stake)+')';c='cancel'}
  else t=(phase==='wait'?'Bet KSh ':'Bet next ride KSh ')+fmt(+b.stakeEl.value||0);
  if(b.act.textContent!==t)b.act.textContent=t;
  b.act.className='act '+c;b.act.disabled=(c==='done'||c==='lost'||!!b.busy);
  b.stakeEl.disabled=b.queued||b.active;b.autoEl.disabled=b.queued||b.active;
}
let lastHistHtml='';
function renderHist(){const list=(phase==='crash'?[crashAt].concat(hist):hist).slice(0,20);const h=list.map(h=>`<span class="chip ${h>=10?'hi':h>=2?'mid':''}">${h.toFixed(2)}x</span>`).join('');if(h!==lastHistHtml){lastHistHtml=h;$('#hist').innerHTML=h}}

function startRide(ts){phase='fly';mult=1;crashAt=round.crashAt||0;engStart();tone(990,.15,'triangle',.1)}
function crash(ts){
  phase='crash';tc=ts;crashAt=round.crashAt;mult=crashAt;
  engStop();boom();
  refreshMe();
  for(let i=0;i<(riderOn?34:0);i++)parts.push({x:riderX+30,y:cv.clientHeight*.86,vx:(Math.random()-.5)*260,vy:-Math.random()*180,r:6+Math.random()*10,a:1});
}
function waitNext(){phase='wait';mult=1}

function loop(ts){
  const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
  const now=sNow();
  if(window.gameOn&&ts-rpT>(phase==='fly'?600:1000)){rpT=ts;pollRound()}
  if(round&&round.n!==rdN){rdN=round.n;rdT=0}
  if(window.gameOn&&!document.hidden&&ts-rdT>2000){rdT=ts;pollRiders()}
  if(round)hist=round.hist;
  if(!round){
    if(phase!=='wait')waitNext();
    countdown=0;
  }else{
    const st=round.startAt,known=round.crashAt!=null,end=known?st+Math.log(round.crashAt)/K*1000:Infinity;
    if(known&&now>=end+CRASH_MS){
      if(phase==='fly')crash(ts);
      doneN=round.n;round=null;waitNext();countdown=0;
    }else if(now<st){
      if(phase!=='wait'){if(phase==='fly')crash(ts);waitNext()}
      countdown=(st-now)/1000;
      const k=Math.ceil(countdown);if(k!==lastK){lastK=k;if(k>=1&&k<=3)tone(660,.08,'triangle',.08)}
    }else if(now<end){
      if(phase==='wait')startRide(ts);
      if(phase==='fly'){
        mult=Math.min(1000,Math.exp(K*(now-st)/1000));engUpdate();
        bets.forEach(b=>{const a=parseFloat(b.autoEl.value);if(b.active&&!b.cashed&&!b.autoPinged&&a>1.01&&mult>=a){b.autoPinged=true;refreshMe()}});
      }
    }else{
      if(phase==='wait'){
        if(bets.some(b=>b.queued||b.active))startRide(ts);
        else{phase='crash';tc=ts;mult=crashAt=round.crashAt}
      }
      if(phase==='fly')crash(ts);
    }
  }
  syncBets();bets.forEach(autoPlace);renderHist();draw(dt);bets.forEach(render);renderPanel(ts);requestAnimationFrame(loop);
}

function hs(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function layer(W,f,tw,fn){const off=scroll*f,i0=Math.floor(off/tw)-1,n=Math.ceil(W/tw)+3;for(let i=i0;i<i0+n;i++)fn(i,i*tw-off)}

function tyre(cx,cy,rot){
  const R=15;ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='#0c0c0e';ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
